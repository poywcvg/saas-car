{% extends "dash_base.html" %}

{% block title %}ویرایش خودرو{% endblock %}

{% block app_content %}
<div class="reveal mx-auto max-w-xl">

    <a href="{% url 'vehicles:detail' pk=vehicle.pk %}" class="inline-flex items-center gap-1 text-sm font-bold text-ink-muted hover:text-ink mb-4">
        <svg class="h-4 w-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg>
        {{ vehicle.display_name }}
    </a>

    <h1 class="text-2xl sm:text-3xl">ویرایش مشخصات خودرو</h1>
    <p class="mt-1 text-ink-soft font-medium mb-6">مشخصات خودروی «{{ customer.full_name }}» را کامل یا اصلاح کن.</p>

    <form method="post" novalidate>
        {% csrf_token %}
        <div class="card card-pad">
            {% include 'vehicles/_form.html' %}
        </div>
        <button type="submit" class="btn-primary btn-block btn-lg mt-6">
            <svg class="h-5 w-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg>
            ذخیره تغییرات
        </button>
    </form>

</div>
{% endblock %}
