{# آکاردئونِ پرسش‌های پرتکرار. ورودی: faqs = [(پرسش، پاسخ), ...]
   پاسخ‌ها در HTML هم هستند (نه فقط JSON-LD)، چون گوگل FAQ را فقط وقتی
   می‌پذیرد که کاربر همان متن را روی صفحه ببیند. #}
<div class="grid gap-3 max-w-3xl{% if center %} mx-auto{% endif %}" x-data="{ open: 1 }">
    {% for q, a in faqs %}
    <div class="card overflow-hidden">
        <h3>
            <button type="button" @click="open = open === {{ forloop.counter }} ? 0 : {{ forloop.counter }}"
                    :aria-expanded="open === {{ forloop.counter }}"
                    class="flex w-full min-h-[56px] items-center justify-between gap-3 p-4 sm:p-5 text-right text-base font-bold text-ink">
                <span class="flex items-center gap-3">
                    <span class="grid h-8 w-8 shrink-0 place-items-center rounded-full bg-brand-50 text-brand-600 text-sm font-black" aria-hidden="true">؟</span>
                    <span>{{ q }}</span>
                </span>
                <svg class="h-5 w-5 shrink-0 text-ink-muted transition-transform"
                     :class="open === {{ forloop.counter }} && 'rotate-180'"
                     viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg>
            </button>
        </h3>
        {# بدون x-cloak: متن برای خزنده و بی‌جاوااسکریپت هم در HTML می‌ماند #}
        <div x-show="open === {{ forloop.counter }}" x-transition
             {% if not forloop.first %}style="display:none"{% endif %}
             class="px-4 pb-4 sm:px-5 sm:pb-5 pr-[3.75rem] sm:pr-[4.25rem] text-ink-soft leading-8">
            {{ a }}
        </div>
    </div>
    {% endfor %}
</div>
