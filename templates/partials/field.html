{# رندر یکدست یک فیلد فرم — استفاده: {% include 'partials/field.html' with field=form.username %} #}
<div class="field">
    {% if field.label %}
    <label for="{{ field.id_for_label }}" class="label flex items-center gap-1.5">
        {{ field.label }}
        {% if field.field.required %}
        <span class="rounded-full bg-red-50 px-1.5 py-0.5 text-[0.65rem] font-bold text-danger">الزامی</span>
        {% else %}
        <span class="text-[0.65rem] font-medium text-ink-muted">(اختیاری)</span>
        {% endif %}
    </label>
    {% endif %}

    {{ field }}

    {% if field.help_text %}
    <p class="help flex items-center gap-1">
        <svg class="h-3.5 w-3.5 shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4M12 8h.01"/></svg>
        {{ field.help_text }}
    </p>
    {% endif %}

    {% for error in field.errors %}
    <p class="error-text flex items-center gap-1">
        <svg class="h-3.5 w-3.5 shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 8v4M12 16h.01"/></svg>
        {{ error }}
    </p>
    {% endfor %}
</div>
