{% extends "base.html" %}

{% block title %}ساخت کسب‌  و کار{% endblock %}

{% block content %}
<div class="container-app py-12 sm:py-20">
    <div class="mx-auto w-full max-w-md">
        <div class="text-center mb-8">
            <span class="grid h-14 w-14 mx-auto place-items-center rounded-2xl bg-brand-50 text-brand-600 mb-4">
                <svg class="h-7 w-7" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><path d="M9 22V12h6v10"/></svg>
            </span>
            <h1 class="text-3xl">کسب‌وکارت رو بساز</h1>
            <p class="mt-2 text-ink-soft font-medium">اسم مجموعه‌ات رو وارد کن تا شروع کنیم.</p>
        </div>

        <div class="card card-pad">
            <form method="post" class="space-y-5">
                {% csrf_token %}
                {% include 'partials/field.html' with field=form.name %}
                <button type="submit" class="btn-primary btn-block btn-lg">ایجاد کسب‌ و کار</button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
